<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chuchipanda WiFi Park · Menú Digital</title>

  <!-- Fuentes Google (elegantes) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'serif': ['"Playfair Display"', 'Georgia', 'serif'],
            'sans': ['Lato', 'Arial', 'sans-serif'],
          },
          colors: {
            'madera': '#3e2723',
            'verde-oscuro': '#2d4a22',
            'verde-medio': '#558b2f',
            'crema': '#fdfcf7',
            'dorado': '#c2a56c',
            'dorado-claro': '#e7d7b5',
          }
        }
      }
    }
  </script>

  <!-- QR Code Generator -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    body {
      background-color: #fdfcf7;
      background-image: radial-gradient(circle at 20% 50%, rgba(194, 165, 108, 0.05) 0%, transparent 50%);
      font-family: 'Lato', sans-serif;
    }
    .category-pill {
      transition: all 0.3s ease;
    }
    .category-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .category-pill.active {
      background-color: #2d4a22;
      color: white;
      border-color: #2d4a22;
    }
    .plate-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .plate-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.1);
    }
    .nav-scroll {
      scrollbar-width: thin;
      scrollbar-color: #c2a56c #f0f0f0;
    }
    .nav-scroll::-webkit-scrollbar {
      height: 6px;
    }
    .nav-scroll::-webkit-scrollbar-thumb {
      background-color: #c2a56c;
      border-radius: 10px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- ==================== VISTA CLIENTE ==================== -->
  <div id="customer-view" class="flex-1 flex flex-col">
    <!-- Encabezado premium -->
    <header class="bg-madera text-white py-8 px-4 shadow-lg relative overflow-hidden">
      <div class="absolute inset-0 opacity-10 bg-cover bg-center" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><path d=%22M20 20 Q40 10 60 20 T100 20%22 stroke=%22white%22 fill=%22none%22 stroke-width=%220.5%22/></svg>');"></div>
      <div class="max-w-5xl mx-auto text-center relative z-10">
        <h1 class="font-serif text-4xl md:text-5xl lg:text-6xl font-bold tracking-wide">
          Chuchipanda <span class="text-dorado-claro">WiFi Park</span>
        </h1>
        <div class="w-16 h-0.5 bg-dorado mx-auto my-4"></div>
        <p class="text-lg md:text-xl font-light text-gray-200 tracking-wider">Nuestro menú de hoy · Preparado con dedicación</p>
      </div>
    </header>

    <!-- Navegación por categorías (píldoras dinámicas) -->
    <nav class="sticky top-0 bg-white/90 backdrop-blur-md shadow-sm z-20 border-b border-gray-200">
      <div id="category-nav" class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-2 overflow-x-auto nav-scroll">
        <!-- Se rellena con JS -->
      </div>
    </nav>

    <!-- Contenido del menú -->
    <main id="menu-content" class="flex-1 max-w-6xl mx-auto px-4 py-8 w-full">
      <!-- Se rellena dinámicamente -->
    </main>

    <!-- Pie de página con acceso al admin -->
    <footer class="bg-gray-50 border-t border-gray-200 py-6 text-center">
      <button id="show-admin-btn" class="text-sm text-madera hover:text-verde-oscuro underline underline-offset-2 transition">
        🔑 Administrar menú
      </button>
    </footer>
  </div>

  <!-- ==================== VISTA ADMINISTRADOR ==================== -->
  <div id="admin-view" class="flex-1 hidden">
    <div class="max-w-6xl mx-auto px-4 py-8">
      <!-- Barra superior -->
      <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
        <button id="back-to-menu-btn" class="bg-madera text-white px-5 py-2.5 rounded-lg hover:bg-opacity-90 transition shadow-md flex items-center gap-2">
          <span>←</span> Volver al Menú
        </button>
        <h2 class="font-serif text-3xl font-bold text-madera">Panel de Administración</h2>
        <div class="w-24 hidden md:block"></div> <!-- espaciador -->
      </div>

      <!-- Formulario para agregar/editar -->
      <section class="bg-white rounded-xl shadow-lg p-6 md:p-8 mb-10 border border-gray-200">
        <h3 class="font-serif text-2xl font-semibold text-madera mb-6" id="form-title">Agregar Nuevo Producto</h3>
        <form id="item-form" class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <input type="hidden" id="item-id" />
          <input type="hidden" id="item-image-data" />
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del producto</label>
            <input type="text" id="item-name" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-verde-medio focus:border-transparent" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
            <select id="item-category" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-verde-medio focus:border-transparent">
              <option value="">Seleccionar...</option>
              <option value="Bebidas">Bebidas</option>
              <option value="Snacks">Snacks</option>
              <option value="Caramelos">Caramelos</option>
              <option value="Sandwiches">Sandwiches</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
            <textarea id="item-description" rows="2" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-verde-medio focus:border-transparent"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Precio</label>
            <input type="text" id="item-price" required placeholder="Ej: $5.000" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-verde-medio focus:border-transparent" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Imagen (opcional)</label>
            <input type="file" id="item-image" accept="image/*" class="w-full text-sm file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:bg-verde-oscuro file:text-white hover:file:bg-verde-medio transition" />
            <div id="image-preview-container" class="mt-3 hidden">
              <div class="flex items-center gap-3">
                <img id="image-preview" src="" alt="Preview" class="h-16 w-16 object-cover rounded-lg border" />
                <button type="button" id="remove-image-btn" class="text-red-600 hover:text-red-800 text-sm underline">Quitar imagen</button>
              </div>
            </div>
          </div>
          <div class="md:col-span-2 flex gap-3">
            <button type="submit" class="bg-verde-oscuro text-white px-6 py-3 rounded-lg font-semibold hover:bg-verde-medio transition shadow-md">
              💾 Guardar Producto
            </button>
            <button type="button" id="cancel-edit-btn" class="hidden bg-gray-200 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-300 transition">
              Cancelar
            </button>
          </div>
        </form>
      </section>

      <!-- Tabla de inventario -->
      <section class="bg-white rounded-xl shadow-lg p-6 md:p-8 border border-gray-200 mb-10">
        <h3 class="font-serif text-2xl font-semibold text-madera mb-6">Inventario del Menú</h3>
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead>
              <tr class="bg-gray-50">
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Imagen</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Producto</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Categoría</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Precio</th>
                <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">Disponible</th>
                <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">Acciones</th>
              </tr>
            </thead>
            <tbody id="admin-items-list" class="bg-white divide-y divide-gray-200"></tbody>
          </table>
        </div>
      </section>

      <!-- Código QR -->
      <section class="bg-white rounded-xl shadow-lg p-6 md:p-8 border border-gray-200">
        <h3 class="font-serif text-2xl font-semibold text-madera mb-4">Código QR para Clientes</h3>
        <p class="text-gray-600 mb-6">Escanea este código para ver el menú. Imprímelo y pégalo en las mesas.</p>
        <div class="flex justify-center">
          <div id="qr-code-container" class="p-4 bg-white rounded-xl shadow-md inline-block"></div>
        </div>
        <p class="text-center text-sm text-gray-500 mt-4 break-all" id="qr-url"></p>
      </section>
    </div>
  </div>

  <script>
    (function() {
      // ==================== DATOS Y ALMACENAMIENTO ====================
      const STORAGE_KEY = 'chuchipanda_menu';
      let menu = [];  // Siempre inicia vacío

      function loadMenu() {
        const stored = localStorage.getItem(STORAGE_KEY);
        menu = stored ? JSON.parse(stored) : [];
        if (!stored) saveMenu(); // guarda array vacío
      }

      function saveMenu() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(menu));
      }

      function getNextId() {
        return menu.length > 0 ? Math.max(...menu.map(item => item.id)) + 1 : 1;
      }

      // ==================== MANEJO DE IMAGEN BASE64 ====================
      const imageInput = document.getElementById('item-image');
      const imagePreviewContainer = document.getElementById('image-preview-container');
      const imagePreview = document.getElementById('image-preview');
      const removeImageBtn = document.getElementById('remove-image-btn');
      const itemImageDataInput = document.getElementById('item-image-data');
      let currentImageData = null;

      imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
          currentImageData = ev.target.result;
          itemImageDataInput.value = currentImageData;
          imagePreview.src = currentImageData;
          imagePreviewContainer.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      });

      removeImageBtn.addEventListener('click', () => {
        currentImageData = null;
        itemImageDataInput.value = '';
        imageInput.value = '';
        imagePreviewContainer.classList.add('hidden');
      });

      function resetImageField() {
        currentImageData = null;
        itemImageDataInput.value = '';
        imageInput.value = '';
        imagePreviewContainer.classList.add('hidden');
      }

      function loadImageIntoForm(imageData) {
        if (imageData) {
          currentImageData = imageData;
          itemImageDataInput.value = imageData;
          imagePreview.src = imageData;
          imagePreviewContainer.classList.remove('hidden');
        } else {
          resetImageField();
        }
      }

      // ==================== VISTA CLIENTE (PREMIUM) ====================
      const categoryNav = document.getElementById('category-nav');
      const menuContent = document.getElementById('menu-content');
      let currentCategory = 'Todos'; // Filtro activo

      function renderCategoryNav() {
        const available = menu.filter(i => i.available);
        const cats = [...new Set(available.map(i => i.category))];
        let html = `<button data-category="Todos" class="category-pill px-4 py-2 rounded-full border border-gray-300 text-sm font-medium whitespace-nowrap ${currentCategory === 'Todos' ? 'active' : 'bg-white text-gray-700 hover:border-verde-oscuro'}">✨ Todos</button>`;
        cats.forEach(cat => {
          const active = (currentCategory === cat);
          html += `<button data-category="${cat}" class="category-pill px-4 py-2 rounded-full border text-sm font-medium whitespace-nowrap ${active ? 'active' : 'bg-white text-gray-700 hover:border-verde-oscuro'}">${cat}</button>`;
        });
        categoryNav.innerHTML = html;

        categoryNav.querySelectorAll('button').forEach(btn => {
          btn.addEventListener('click', () => {
            currentCategory = btn.dataset.category;
            renderCategoryNav();
            renderMenuItems();
          });
        });
      }

      function renderMenuItems() {
        const available = menu.filter(i => i.available);
        let filtered = available;
        if (currentCategory !== 'Todos') {
          filtered = available.filter(i => i.category === currentCategory);
        }

        if (filtered.length === 0) {
          menuContent.innerHTML = `
            <div class="text-center py-20">
              <div class="text-6xl mb-4">🍃</div>
              <p class="text-2xl font-serif text-gray-500">No hay productos en esta sección</p>
              <p class="text-gray-400 mt-2">Prueba con otra categoría o espera nuestras novedades.</p>
            </div>`;
          return;
        }

        if (currentCategory === 'Todos') {
          const grouped = {};
          filtered.forEach(item => {
            if (!grouped[item.category]) grouped[item.category] = [];
            grouped[item.category].push(item);
          });
          let html = '';
          for (const [cat, items] of Object.entries(grouped)) {
            html += `
              <div class="mb-12">
                <h2 class="font-serif text-3xl font-bold text-madera mb-6 flex items-center gap-3">
                  <span class="w-8 h-0.5 bg-dorado inline-block"></span>${cat}
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  ${items.map(item => plateCardHTML(item)).join('')}
                </div>
              </div>`;
          }
          menuContent.innerHTML = html;
        } else {
          const html = `
            <div class="mb-8">
              <h2 class="font-serif text-3xl font-bold text-madera mb-6 flex items-center gap-3">
                <span class="w-8 h-0.5 bg-dorado inline-block"></span>${currentCategory}
              </h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                ${filtered.map(item => plateCardHTML(item)).join('')}
              </div>
            </div>`;
          menuContent.innerHTML = html;
        }
      }

      // ✅ Función plateCardHTML con object-contain (imágenes sin recortar)
      function plateCardHTML(item) {
        return `
          <div class="plate-card bg-white rounded-2xl shadow-md overflow-hidden border border-gray-100 flex flex-col">
            ${item.image ? `
              <div class="bg-gray-100 flex justify-center items-center p-3">
                <img src="${item.image}" alt="${item.name}" class="w-full h-48 object-contain" />
              </div>` : ''}
            <div class="p-5 flex flex-col flex-1">
              <div class="flex justify-between items-start gap-4">
                <h3 class="font-serif text-xl font-semibold text-madera leading-tight">${item.name}</h3>
                <span class="text-verde-oscuro font-bold text-xl whitespace-nowrap">${item.price}</span>
              </div>
              <p class="text-gray-600 mt-2 text-sm leading-relaxed flex-1">${item.description || ''}</p>
              <div class="mt-4 flex items-center text-xs text-verde-medio">
                <span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span> Disponible
              </div>
            </div>
          </div>`;
      }

      function refreshCustomerView() {
        renderCategoryNav();
        renderMenuItems();
      }

      // ==================== VISTA ADMINISTRADOR ====================
      const adminView = document.getElementById('admin-view');
      const itemForm = document.getElementById('item-form');
      const itemIdInput = document.getElementById('item-id');
      const itemNameInput = document.getElementById('item-name');
      const itemCategoryInput = document.getElementById('item-category');
      const itemDescriptionInput = document.getElementById('item-description');
      const itemPriceInput = document.getElementById('item-price');
      const cancelEditBtn = document.getElementById('cancel-edit-btn');
      const formTitle = document.getElementById('form-title');
      const adminItemsList = document.getElementById('admin-items-list');
      let editingId = null;

      function resetForm() {
        itemForm.reset();
        itemIdInput.value = '';
        editingId = null;
        formTitle.textContent = 'Agregar Nuevo Producto';
        cancelEditBtn.classList.add('hidden');
        resetImageField();
      }

      function populateForm(item) {
        itemIdInput.value = item.id;
        itemNameInput.value = item.name;
        itemCategoryInput.value = item.category;
        itemDescriptionInput.value = item.description || '';
        itemPriceInput.value = item.price;
        editingId = item.id;
        formTitle.textContent = 'Editar Producto';
        cancelEditBtn.classList.remove('hidden');
        loadImageIntoForm(item.image || null);
      }

      function renderAdminTable() {
        if (menu.length === 0) {
          adminItemsList.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-gray-500 font-light">No hay productos registrados. ¡Agrega el primero!</td></tr>`;
          return;
        }
        let html = '';
        menu.forEach(item => {
          const availableClass = item.available ? 'bg-green-500' : 'bg-gray-400';
          html += `
            <tr class="hover:bg-gray-50 transition">
              <td class="px-4 py-4 whitespace-nowrap">
                ${item.image ? `<img src="${item.image}" class="h-10 w-10 object-cover rounded-lg shadow-sm" />` : '<span class="text-gray-400 text-xs">—</span>'}
              </td>
              <td class="px-4 py-4">
                <div class="font-medium text-gray-900">${item.name}</div>
                <div class="text-sm text-gray-500">${item.description || ''}</div>
              </td>
              <td class="px-4 py-4 text-sm text-gray-700">${item.category}</td>
              <td class="px-4 py-4 text-sm font-semibold">${item.price}</td>
              <td class="px-4 py-4 text-center">
                <button data-id="${item.id}" class="toggle-avail w-12 h-6 rounded-full relative focus:outline-none transition ${availableClass}">
                  <span class="absolute left-0 top-0 bottom-0 m-0.5 w-5 h-5 bg-white rounded-full shadow transform transition-transform duration-200 ${item.available ? 'translate-x-6' : ''}"></span>
                </button>
              </td>
              <td class="px-4 py-4 text-center text-sm">
                <button data-id="${item.id}" class="edit-item text-indigo-600 hover:text-indigo-800 mr-3">✏️</button>
                <button data-id="${item.id}" class="delete-item text-red-600 hover:text-red-800">🗑️</button>
              </td>
            </tr>`;
        });
        adminItemsList.innerHTML = html;

        document.querySelectorAll('.toggle-avail').forEach(btn => {
          btn.addEventListener('click', () => toggleAvailability(parseInt(btn.dataset.id)));
        });
        document.querySelectorAll('.edit-item').forEach(btn => {
          btn.addEventListener('click', () => {
            const item = menu.find(i => i.id === parseInt(btn.dataset.id));
            if (item) populateForm(item);
          });
        });
        document.querySelectorAll('.delete-item').forEach(btn => {
          btn.addEventListener('click', () => deleteItem(parseInt(btn.dataset.id)));
        });
      }

      function addOrUpdateItem(name, category, description, price, imageData) {
        if (editingId) {
          const idx = menu.findIndex(i => i.id === editingId);
          if (idx !== -1) {
            menu[idx].name = name;
            menu[idx].category = category;
            menu[idx].description = description;
            menu[idx].price = price;
            menu[idx].image = imageData || null;
          }
        } else {
          menu.push({
            id: getNextId(),
            name,
            category,
            description,
            price,
            available: true,
            image: imageData || null
          });
        }
        saveMenu();
        renderAdminTable();
        refreshCustomerView();
        resetForm();
      }

      function deleteItem(id) {
        if (confirm('¿Eliminar este producto permanentemente?')) {
          menu = menu.filter(i => i.id !== id);
          saveMenu();
          renderAdminTable();
          refreshCustomerView();
          if (editingId === id) resetForm();
        }
      }

      function toggleAvailability(id) {
        const item = menu.find(i => i.id === id);
        if (item) {
          item.available = !item.available;
          saveMenu();
          renderAdminTable();
          refreshCustomerView();
        }
      }

      itemForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = itemNameInput.value.trim();
        const category = itemCategoryInput.value;
        const description = itemDescriptionInput.value.trim();
        const price = itemPriceInput.value.trim();
        const imageData = itemImageDataInput.value || null;
        if (!name || !category || !price) {
          alert('Nombre, categoría y precio son obligatorios.');
          return;
        }
        addOrUpdateItem(name, category, description, price, imageData);
      });

      cancelEditBtn.addEventListener('click', resetForm);

      // ==================== CÓDIGO QR ====================
      function generateQRCode() {
        const qrContainer = document.getElementById('qr-code-container');
        qrContainer.innerHTML = '';
        const url = window.location.href;
        document.getElementById('qr-url').textContent = url;
        new QRCode(qrContainer, {
          text: url,
          width: 180,
          height: 180,
          colorDark: '#2d4a22',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H
        });
      }

      // ==================== NAVEGACIÓN ENTRE VISTAS ====================
      const customerView = document.getElementById('customer-view');
      const showAdminBtn = document.getElementById('show-admin-btn');
      const backToMenuBtn = document.getElementById('back-to-menu-btn');
      const ADMIN_PASSWORD = 'admin123';

      showAdminBtn.addEventListener('click', () => {
        const pass = prompt('Ingrese la contraseña de administrador:');
        if (pass === ADMIN_PASSWORD) {
          customerView.style.display = 'none';
          adminView.style.display = 'block';
          renderAdminTable();
          generateQRCode();
        } else if (pass !== null) {
          alert('Contraseña incorrecta.');
        }
      });

      backToMenuBtn.addEventListener('click', () => {
        adminView.style.display = 'none';
        customerView.style.display = 'block';
        resetForm();
        refreshCustomerView();
      });

      // ==================== INICIO ====================
      loadMenu();
      refreshCustomerView();
    })();
  </script>
</body>
</html>
